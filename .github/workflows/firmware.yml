name: Firmware to the site

# Takes the latest firmware builds from the two tracker repositories and makes
# them the current firmware on the engineering Tracker page (/eng/tracker).
# Runs daily, after each successful deploy and on demand; a version that is already there is skipped.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  workflow_run:
    workflows: ["Test and deploy"]
    types: [completed]

jobs:
  firmware:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the latest builds
        run: |
          mkdir -p fw
          fetch() {  # repo artifact key
            local meta id sha date
            meta=$(gh api "repos/ivan160281-oss/$1/actions/artifacts?name=$2&per_page=50" \
              -q '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main")][0] | [.id, .workflow_run.head_sha, .created_at] | @tsv')
            [ -n "$meta" ] || { echo "No build of $2 in $1"; return 1; }
            read -r id sha date <<<"$meta"
            gh api "repos/ivan160281-oss/$1/actions/artifacts/$id/zip" > "fw/$3.zip"
            mkdir -p "fw/$3" && unzip -q -o "fw/$3.zip" -d "fw/$3"
            local bin
            bin=$(find "fw/$3" -name '*.merged.bin' | head -1)
            [ -n "$bin" ] || { echo "No .merged.bin in $2"; find "fw/$3"; return 1; }
            mv "$bin" "fw/$3.bin"
            echo "$3 ${date:0:10}-${sha:0:7} $1" >> fw/list.txt
            ls -la "fw/$3.bin"
          }
          fetch wifigps tpager-gps-wifi-tracker-bin devtr
          fetch WIFI_GPS_T-CALL altgeo-gsm-tracker-bin altgeo-gsm
          cat fw/list.txt
      - name: Set up SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ["DEPLOY_SSH_KEY"].replace("\r", "")
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", raw, re.S)
          body = "".join(m.group(2).split())
          key = f"-----BEGIN {m.group(1)}-----\n" + "\n".join(textwrap.wrap(body, 70)) + f"\n-----END {m.group(1)}-----\n"
          with open(os.path.expanduser("~/.ssh/id_deploy"), "w") as f:
              f.write(key)
          PY
          chmod 600 ~/.ssh/id_deploy
          # The hosting sometimes drops a connection: try a few times.
          for i in 1 2 3 4 5; do
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
            sleep $((i * 3))
          done
      - name: Install on the site
        run: |
          # The hosting resets SSH connections now and then: retry, and use few of them.
          ssh_retry() {
            for i in 1 2 3 4 5; do
              ssh -i "$HOME/.ssh/id_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$@" && return 0
              [ $? -eq 255 ] || return 1
              sleep $((i * 10))
            done
            return 1
          }
          ssh_retry -n "~/altgeo/venv/bin/python -c \"import sqlite3, os; c = sqlite3.connect(os.path.expanduser('~/altgeo-data/eng/wifigps.db')); [print(k, v) for k, v in c.execute('SELECT t.key, f.version FROM device_firmwares f JOIN device_types t ON t.id = f.device_type_id')]\"" > fw/installed.txt
          : > fw/new.txt
          while read -r key version repo; do
            if grep -qx "$key $version" fw/installed.txt; then echo "$key $version: already installed"
            else echo "$key $version $repo" >> fw/new.txt; fi
          done < fw/list.txt
          [ -s fw/new.txt ] || { echo "Nothing new"; exit 0; }
          files=$(cut -d' ' -f1 fw/new.txt | sed 's/$/.bin/')
          (cd fw && tar czf ../upload.tgz new.txt $files)
          ssh_retry "rm -rf ~/altgeo-data/eng/inbox && mkdir -p ~/altgeo-data/eng/inbox && cd ~/altgeo-data/eng/inbox && tar xzf - && \
            while read -r key version repo; do \
              ~/altgeo/venv/bin/python ~/altgeo/eng/tools/install_firmware.py --data-dir ~/altgeo-data/eng \
                --key \$key --version \$version --file \$key.bin --notes \"Сборка GitHub Actions из \$repo\" || exit 1; \
            done < new.txt && cd && rm -rf ~/altgeo-data/eng/inbox" < upload.tgz
